[project]
name = "coursework-project-4"
version = "0.1.0"
description = ""
authors = [
    {name = "alex_svch_777",email = "logger_77@mail.ru"}
]
requires-python = ">=3.14"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pillow (>=13.0.0,<14.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.5.0,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)"
]

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | migrations
)/
'''

[tool.flake8]
max-line-length = 119
exclude = [".git", "__pycache__", ".venv", "venv", "migrations"]

